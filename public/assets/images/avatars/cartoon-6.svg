    <ellipse cx="74" cy="62" rx="3.5" ry="5" fill="#2d3436"/>
    <circle cx="73" cy="60" r="1.5" fill="#ffffff"/>
    <!-- Cheeks -->
    <circle cx="36" cy="72" r="6" fill="#ff7675" opacity="0.6"/>
