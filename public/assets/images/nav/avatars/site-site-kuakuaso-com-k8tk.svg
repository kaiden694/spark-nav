<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF424D" />
      <stop offset="50%" stop-color="#ff727a" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <g transform="translate(10, 10)">
    <!-- Folder Back -->
    <path d="M 10 20 C 10 14.5 14.5 10 20 10 L 40 10 C 43 10 45.5 11.5 47 14 L 53 24 L 90 24 C 95.5 24 100 28.5 100 34 L 100 80 C 100 85.5 95.5 90 90 90 L 20 90 C 14.5 90 10 85.5 10 80 Z" 
          fill="url(#logo-grad)" opacity="0.85" />
          
    <!-- Folder Front -->
    <path d="M 10 40 C 10 36 13 33 17 33 L 93 33 C 97 33 100 36 100 40 L 100 80 C 100 85.5 95.5 90 90 90 L 20 90 C 14.5 90 10 85.5 10 80 Z" 
          fill="url(#logo-grad)" />

    <!-- Magnifying Glass -->
    <circle cx="65" cy="65" r="16" fill="url(#glass-grad)" stroke="#ffffff" stroke-width="4" />
    <path d="M 76 76 L 90 90" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    
    <!-- Decorative dots -->
    <circle cx="30" cy="55" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="45" cy="65" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="35" cy="75" r="2" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
