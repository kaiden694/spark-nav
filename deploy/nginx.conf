# Nginx 生产环境配置模板 - XIU 静态主题服务
# 适用于独立主机、反向代理集群或 Kubernetes / Docker 容器

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. 字符集与日志
    charset utf-8;
    access_log /var/log/nginx/xiu_access.log;
    error_log /var/log/nginx/xiu_error.log warn;

    # 2. 基础安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 3. Gzip 静态压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 4. 静态长效资产缓存（CSS、JS、字体、图片、媒体）
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 5. Clean URLs 与 HTML 路由重写规则
    # 支持 /posts/slug 自动匹配至 /posts/slug.html
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # 6. 自定义 404 错误页
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
